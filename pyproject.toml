[project]
name = "webview_flask"
version = "0.1.1"
description = "flask app with webview"
authors = [{ name = "Sander van Dragt", email = "sander@vandragt.com" }]
readme = "readme.md"
requires-python = ">=3.12"
dependencies = ["flask>=3.1.2", "pywebview[gtk]>=6.2.1"]

[project.scripts]
webview_flask = "webview_flask.main:main"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-cov>=6.2", "ruff>=0.13", "pex>=2.46"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webview_flask"]

[tool.pytest.ini_options]
addopts = "--cov=webview_flask --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src/webview_flask"]
